plugins { id 'com.android.application' version '8.7.2' }
android {
    namespace 'br.com.samconecta.app'
    compileSdk 35
    defaultConfig { applicationId 'br.com.samconecta.app'; minSdk 23; targetSdk 35; versionCode 1; versionName '0.1.0' }
    buildFeatures { buildConfig true }
    flavorDimensions += 'channel'
    productFlavors {
        usuario { dimension 'channel'; applicationId 'br.com.samconecta.app'; manifestPlaceholders = [appScheme:'samconecta']; resValue 'string','app_name','SAM CONECTA'; buildConfigField 'boolean','IS_ADMIN','false' }
        adm { dimension 'channel'; applicationId 'br.com.samconecta.adm'; manifestPlaceholders = [appScheme:'samconecta-adm']; resValue 'string','app_name','SAM CONECTA ADM'; buildConfigField 'boolean','IS_ADMIN','true' }
    }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
}
